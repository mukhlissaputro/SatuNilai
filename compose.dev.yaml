services:
  app:
    image: satunilai-app:development
    build:
      target: development
    environment:
      NODE_ENV: development
      DOCKER_DEV_POLLING: "1"
      DEV_QUICK_LOGIN: "1"
    ports: !override
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    command: ["sh", "-c", "node scripts/init-db.mjs && node scripts/init-development-accounts.mjs && exec node node_modules/vinext/dist/cli.js dev --hostname 0.0.0.0 --port 3000"]
    volumes:
      - .:/app
      - development_modules:/app/node_modules
  db:
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-3307}:3306"
volumes:
  development_modules:
